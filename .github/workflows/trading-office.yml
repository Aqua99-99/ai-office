# 트레이딩 사무실 — GitHub에서 AI 직원 12명이 종목을 분석해요. (컴퓨터가 꺼져 있어도 돼요)
# 언제 일하나요?
#   1) 평일 아침 7시 40분(한국 시간): 관심종목.txt 의 종목을 분석
#   2) Actions → 트레이딩 사무실 → Run workflow: 종목과 날짜를 적으면 바로 분석
#   3) 이슈에서 "분석 요청" 양식을 쓰면 분석하고 그 이슈에 결과를 답장
# 필요한 것: Settings → Secrets and variables → Actions → Secrets 에 CLAUDE_CODE_OAUTH_TOKEN
#   (내 컴퓨터에서 `claude setup-token` 으로 만들어요. Claude Pro/Max 구독 사용량에서 차감돼요)
name: 트레이딩 사무실

on:
  schedule:
    - cron: "40 22 * * 0-4"   # UTC 일~목 22:40 = 한국 월~금 07:40
  workflow_dispatch:
    inputs:
      tickers:
        description: "종목 (쉼표로 구분, 비우면 관심종목.txt). 예: 삼성전자, NVDA, 000660.KS"
        required: false
        default: ""
      date:
        description: "분석 날짜 YYYY-MM-DD (비우면 오늘)"
        required: false
        default: ""
      rounds:
        description: "토론 라운드 (1~3)"
        required: false
        default: "1"
  issues:
    types: [opened]

concurrency:
  group: trading-office
  cancel-in-progress: false

permissions:
  contents: write
  issues: write
  id-token: write

jobs:
  check:
    # 분석 요청 이슈만, 그리고 저장소에 쓰기 권한이 있는 사람이 쓴 것만 받아요.
    if: >-
      github.event_name != 'issues' || (
        startsWith(github.event.issue.title, '[분석요청]') &&
        contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.issue.author_association))
    runs-on: ubuntu-latest
    outputs:
      go: ${{ steps.c.outputs.go }}
    steps:
      - id: c
        env:
          GH_TOKEN: ${{ github.token }}
          ALLOW: ${{ vars.AIO_ALLOW_PUBLIC }}
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        run: |
          info=$(gh api "repos/$GITHUB_REPOSITORY")
          t=$(echo "$info" | jq -r .is_template); p=$(echo "$info" | jq -r .private)
          if [ "$HAS_TOKEN" != "true" ]; then echo "::warning::CLAUDE_CODE_OAUTH_TOKEN 비밀값이 없어요. README의 '시작하기'를 보세요."; echo "go=false" >> "$GITHUB_OUTPUT"
          elif [ "$t" = "true" ]; then echo "원본(템플릿) 저장소라 쉬어요."; echo "go=false" >> "$GITHUB_OUTPUT"
          elif [ "$p" != "true" ] && [ "$ALLOW" != "1" ]; then echo "::warning::공개 저장소라 쉬어요. 비공개로 바꾸거나 Variables에 AIO_ALLOW_PUBLIC = 1 을 넣으세요."; echo "go=false" >> "$GITHUB_OUTPUT"
          else echo "go=true" >> "$GITHUB_OUTPUT"; fi

  office:
    needs: check
    if: needs.check.outputs.go == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: 데이터 도구 설치 (TradingAgents 데이터 계층)
        run: pip install -q -r requirements.txt

      - name: 직원과 팀장 배치
        run: |
          mkdir -p .claude/agents .claude/skills
          cp agents/*.md .claude/agents/
          cp -r skills/* .claude/skills/

      - name: 할 일 정리
        id: job
        env:
          IN_TICKERS: ${{ github.event.inputs.tickers }}
          IN_DATE: ${{ github.event.inputs.date }}
          IN_ROUNDS: ${{ github.event.inputs.rounds }}
          ISSUE_BODY: ${{ github.event.issue.body }}
        run: |
          python3 - <<'PY'
          import os, re, datetime, zoneinfo
          body = os.environ.get("ISSUE_BODY") or ""
          def field(label):
              m = re.search(r"###\s*" + label + r"[^\n]*\n+(.*?)(?=\n###|\Z)", body, re.S)
              v = (m.group(1).strip() if m else "")
              return "" if v == "_No response_" else v
          tickers = os.environ.get("IN_TICKERS") or field("종목")
          date = os.environ.get("IN_DATE") or field("분석 날짜")
          rounds = os.environ.get("IN_ROUNDS") or field("토론 라운드") or "1"
          holding = field("보유 현황")
          if not tickers.strip():
              lines = open("관심종목.txt", encoding="utf-8").read().splitlines()
              tickers = ",".join(l.split("#")[0].strip() for l in lines if l.split("#")[0].strip())
          # 이슈 내용은 남이 쓴 글이라, 종목에 쓸 수 있는 글자만 남겨요.
          items = [t.strip() for t in re.split(r"[,\n]", tickers) if t.strip()]
          ok = [t for t in items if re.fullmatch(r"[0-9A-Za-z가-힣.\-^=]{1,20}", t)]
          today = datetime.datetime.now(zoneinfo.ZoneInfo("Asia/Seoul")).strftime("%Y-%m-%d")
          if not re.fullmatch(r"\d{4}-\d{2}-\d{2}", date or ""): date = today
          rounds = rounds if rounds in ("1", "2", "3") else "1"
          holding = re.sub(r"[^0-9A-Za-z가-힣.,:%\s\-]", "", holding)[:200]
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as f:
              f.write(f"tickers={', '.join(ok[:10])}\n")
              f.write(f"date={date}\nrounds={rounds}\n")
              f.write(f"holding={' '.join(holding.split())}\n")
          print("종목:", ok[:10], "날짜:", date, "라운드:", rounds)
          if not ok: raise SystemExit("분석할 종목이 없어요.")
          PY

      - name: AI 직원들 일하기
        uses: anthropics/claude-code-action@v1
        env:
          TRADING_OFFICE_PYTHON: python3
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
          SEC_EDGAR_USER_AGENT: ${{ vars.SEC_EDGAR_USER_AGENT }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}   # Claude GitHub 앱 설치 없이 돌아가게
          prompt: |
            /analyze 종목: ${{ steps.job.outputs.tickers }} / 분석 날짜: ${{ steps.job.outputs.date }} / 강세·약세 토론 ${{ steps.job.outputs.rounds }}라운드, 리스크 토론 ${{ steps.job.outputs.rounds }}라운드 / 보유 현황: ${{ steps.job.outputs.holding || '없음' }}
            자동 실행이에요. 질문하지 말고 끝까지 진행하세요. 작업 폴더는 지금 폴더(저장소 맨 위)예요.
          claude_args: |
            --allowedTools "Bash,Read,Write,Edit,Glob,Grep,WebSearch,WebFetch,Agent,Task"
            --max-turns 400

      - name: 결과 모으기
        if: always()
        id: out
        env:
          DATE: ${{ steps.job.outputs.date }}
        run: |
          shopt -s nullglob
          : > /tmp/summary.md
          for f in 보고서/"$DATE"_*/summary.md; do cat "$f" >> /tmp/summary.md; printf '\n---\n' >> /tmp/summary.md; done
          if [ -s /tmp/summary.md ]; then echo "has=true" >> "$GITHUB_OUTPUT"; else echo "has=false" >> "$GITHUB_OUTPUT"; fi
          printf '\n보고서 웹페이지는 아래 실행 기록의 **Artifacts**에서 받거나, 저장소의 `보고서/` 폴더에서 볼 수 있어요.\n%s/%s/actions/runs/%s\n' "$GITHUB_SERVER_URL" "$GITHUB_REPOSITORY" "$GITHUB_RUN_ID" >> /tmp/summary.md

      - name: 보고서 웹페이지 올리기
        if: always() && steps.out.outputs.has == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: 트레이딩사무실-보고서-${{ steps.job.outputs.date }}-${{ github.run_number }}
          path: 보고서/${{ steps.job.outputs.date }}_*/report.html
          retention-days: 30

      - name: 기록 저장 (보고서·기억)
        if: always()
        run: |
          git config user.name "트레이딩 사무실"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add 보고서 기억 2>/dev/null || true
          if git diff --cached --quiet; then echo "저장할 변경 없음"; exit 0; fi
          git commit -m "트레이딩 사무실 분석 ${{ steps.job.outputs.date }}"
          for i in 1 2 3; do git pull --rebase --autostash && git push && break; sleep 5; done

      - name: 알림 (이슈)
        if: always() && steps.out.outputs.has == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          DATE: ${{ steps.job.outputs.date }}
        run: |
          if [ -n "$ISSUE_NUMBER" ]; then
            gh issue comment "$ISSUE_NUMBER" --body-file /tmp/summary.md
            gh issue close "$ISSUE_NUMBER" || true
          else
            gh label create "AI 보고" --color "c2643a" --description "트레이딩 사무실 보고서" --force >/dev/null 2>&1 || true
            gh issue create --title "[AI 보고] $DATE 종목 분석" --body-file /tmp/summary.md --label "AI 보고" \
              || gh issue create --title "[AI 보고] $DATE 종목 분석" --body-file /tmp/summary.md
          fi
